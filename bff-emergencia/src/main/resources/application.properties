spring.application.name=bff-emergencia
server.port=8082
# Configuración Resilience4j - Circuit Breaker
resilience4j.circuitbreaker.instances.usuario-service.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.usuario-service.slidingWindowSize=10
resilience4j.circuitbreaker.instances.usuario-service.failureRateThreshold=50.0
resilience4j.circuitbreaker.instances.usuario-service.waitDurationInOpenState=10000
resilience4j.circuitbreaker.instances.usuario-service.permittedNumberOfCallsInHalfOpenState=3

resilience4j.circuitbreaker.instances.reporte-service.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.reporte-service.slidingWindowSize=10
resilience4j.circuitbreaker.instances.reporte-service.failureRateThreshold=50.0
resilience4j.circuitbreaker.instances.reporte-service.waitDurationInOpenState=10000
resilience4j.circuitbreaker.instances.reporte-service.permittedNumberOfCallsInHalfOpenState=3