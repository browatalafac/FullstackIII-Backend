spring.application.name=bff-emergencia
server.port=1020
# Configuración Resilience4j - Circuit Breaker

#usuario-service

resilience4j.circuitbreaker.instances.usuario-service.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.usuario-service.slidingWindowSize=10
resilience4j.circuitbreaker.instances.usuario-service.failureRateThreshold=50.0
resilience4j.circuitbreaker.instances.usuario-service.waitDurationInOpenState=10000
resilience4j.circuitbreaker.instances.usuario-service.permittedNumberOfCallsInHalfOpenState=3

#reporte-service

resilience4j.circuitbreaker.instances.reporte-service.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.reporte-service.slidingWindowSize=10
resilience4j.circuitbreaker.instances.reporte-service.failureRateThreshold=50.0
resilience4j.circuitbreaker.instances.reporte-service.waitDurationInOpenState=10000
resilience4j.circuitbreaker.instances.reporte-service.permittedNumberOfCallsInHalfOpenState=3

# geo-service

resilience4j.circuitbreaker.instances.geo-service.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.geo-service.slidingWindowSize=10
resilience4j.circuitbreaker.instances.geo-service.failureRateThreshold=50.0
resilience4j.circuitbreaker.instances.geo-service.waitDurationInOpenState=10000
resilience4j.circuitbreaker.instances.geo-service.permittedNumberOfCallsInHalfOpenState=3


# notificacion-service

resilience4j.circuitbreaker.instances.notificacion-service.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.notificacion-service.slidingWindowSize=10
resilience4j.circuitbreaker.instances.notificacion-service.failureRateThreshold=50.0
resilience4j.circuitbreaker.instances.notificacion-service.waitDurationInOpenState=10000
resilience4j.circuitbreaker.instances.notificacion-service.permittedNumberOfCallsInHalfOpenState=3


# riesgo-service

resilience4j.circuitbreaker.instances.riesgo-service.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.riesgo-service.slidingWindowSize=10
resilience4j.circuitbreaker.instances.riesgo-service.failureRateThreshold=50.0
resilience4j.circuitbreaker.instances.riesgo-service.waitDurationInOpenState=10000
resilience4j.circuitbreaker.instances.riesgo-service.permittedNumberOfCallsInHalfOpenState=3


# brigada-service

resilience4j.circuitbreaker.instances.brigada-service.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.brigada-service.slidingWindowSize=10
resilience4j.circuitbreaker.instances.brigada-service.failureRateThreshold=50.0
resilience4j.circuitbreaker.instances.brigada-service.waitDurationInOpenState=10000
resilience4j.circuitbreaker.instances.brigada-service.permittedNumberOfCallsInHalfOpenState=3


# Excepciones que activan el circuit breaker (por defecto registra todas,
# pero es buena práctica ser explícito con errores de red)
resilience4j.circuitbreaker.instances.geo-service.recordExceptions=java.net.ConnectException,java.io.IOException,feign.FeignException
resilience4j.circuitbreaker.instances.notificacion-service.recordExceptions=java.net.ConnectException,java.io.IOException,feign.FeignException
resilience4j.circuitbreaker.instances.brigada-service.recordExceptions=java.net.ConnectException,java.io.IOException,feign.FeignException
resilience4j.circuitbreaker.instances.riesgo-service.recordExceptions=java.net.ConnectException,java.io.IOException,feign.FeignException
resilience4j.circuitbreaker.instances.usuario-service.recordExceptions=java.net.ConnectException,java.io.IOException,feign.FeignException
resilience4j.circuitbreaker.instances.reporte-service.recordExceptions=java.net.ConnectException,java.io.IOException,feign.FeignException

# Health endpoints para ver el estado de los circuit breakers
management.endpoints.web.exposure.include=health,circuitbreakers
management.health.circuitbreakers.enabled=true

# Los errores 4xx son respuestas válidas del servicio, no fallas de infraestructura
# Solo ConnectException e IOException indican que el servicio está caído
resilience4j.circuitbreaker.instances.geo-service.ignoreExceptions=feign.FeignException$BadRequest,feign.FeignException$NotFound,feign.FeignException$UnprocessableEntity